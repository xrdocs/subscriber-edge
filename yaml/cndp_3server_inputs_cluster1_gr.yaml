        route:
          to: 2.2.164.0/24
          via: 1.1.164.254
      intudp:
        ip: 1.1.163.3/24
      n4:
        ip: 1.1.161.3/28
      bgp:
        ebgp1:
          id: 152
          intf: enp216s0f0
          ip: 1.1.152.1/24
        ebgp2:
