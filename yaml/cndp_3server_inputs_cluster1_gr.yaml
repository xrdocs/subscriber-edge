cnbng_cp:
  node_defaults:
    route: 10.10.10.0/24 # reverse host route to access nodes via mgmt network
    gateway: 10.105.254.1 # gateway for mgmt network
    dns: 64.104.128.236
    domain: cisco.com
    bond_interfaces:
      bd0:
        links: [ eno5, eno6 ] 
      bd1:
        links: [ enp94s0f1 ]
      bd2:
        links: [ enp94s0f0 ]
  cluster:
    name: cnbng-cndp-3server-geored
    environment: baremetal
    type: 3server_geo-red
    master:
      vip1: 1.1.125.100 # this VIP is for k8s network
      vip2: 10.105.254.91 # this VIP is for mgmt network
    networks:
      k8s:
        id: 125  # VLAN ID
        intf: bd0
      mgmt:
        id: 325  # VLAN ID
        intf: bd0
      inttcp:
        id: 164  # VLAN ID
        intf: bd1
        vip1: 1.1.164.100
        vip2: 1.1.164.101
        broadcast: 1.1.164.255
      intudp:
        id: 163  # VLAN ID
        intf: bd2
        vip1: 1.1.163.100
      n4:
        id: 161  # VLAN ID
        intf: bd2
        vip1: 72.72.100.1  # this IP (advertised by BGP) is used to connect UPs with Instance-1 of this cluster
        vip2: 73.73.100.2  # this IP (advertised by BGP) is used to connect UPs with Instance-2 of this cluster
      cdl:
        id: 165  # VLAN ID
        intf: bd1
        vip1: 1.1.165.100
        vip2: 1.1.165.101
        vip3: 1.1.165.102
        broadcast: 1.1.165.255
    ntp: ntp.esl.cisco.com
    istio: 'false'
    cee_ops_center:
      ssh_port: 2023
      netconf_port: 3023
    bng_ops_center:
      ssh_port: 2024
      netconf_port: 3024
  ucs01:
