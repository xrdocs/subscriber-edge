cnbng_cp:
  node_defaults:
    bond_interfaces:
      bd1:
        links: [enp216s0f0, enp216s0f1]
  bgp:
    aspath_prepend: 'true'
    remote_as: 100
  cluster:
    environment: baremetal
    type: aio_geo-red
    ntp: 72.163.32.44
    istio: 'false'
    cee_ops_center:
      ssh_port: 2023
      netconf_port: 3023
    bng_ops_center:
      ssh_port: 2024
      netconf_port: 3024
    networks:
      management:
        intf: eno1
        gateway: 192.168.107.129
        dns: 72.163.128.140
        domain: cisco.com
      service:
        intf: bd1
        vip1: 1.1.100.1
        vip1_port: 3799
        vip2: 2.2.100.2
        vip2_port: 3799
  node:
    name: aio
    networks:
      service:
        mask: 24
        db_port: 8882
        kafka_port: 10001
        remote_db_port: 8882
        remote_kafka_port: 10001
        geo_port1: 7001
        geo_port2: 7002
        geo_port3: 7003
        geo_port4: 7004
  clusters:
    - site: ucs1
      bgp:
        asn: 65151
        neighbor: 172.101.101.4
      cluster:
        name: cnbng-cluster-1
        id: 1
        remote_id: 2
        networks:
          service:
            id: 101
      node:
        networks:
          management:
            ip: 192.168.107.214
            mask: 25
          service:
            ip: 172.101.101.101
            remote_ip: 172.102.102.102
            route:
              to: 172.102.102.0/24
              via: 172.101.101.4
      cimc:
        ip: 192.168.107.168
    - site: ucs2
      bgp:
        asn: 65152
        neighbor: 172.102.102.4
      cluster:
        name: cnbng-cluster-2
        id: 2
        remote_id: 1
        networks:
          service:
            id: 102
      node:
        networks:
          management:
            ip: 192.168.107.215
            mask: 25
          service:
            ip: 172.102.102.102
            remote_ip: 172.101.101.101
            route:
              to: 172.101.101.0/24
              via: 172.102.102.4
      cimc:
        ip: 192.168.107.170

